  ui_text: "#F4F1EA"
  ui_primary: "#F4F1EA"
  ui_border: "#3A4856"
  ui_tool: "#6E8A8A"
  ui_thinking: "#6E8A8A"
  ui_ok: "#6B8E5A"
  ui_warn: "#D49B4A"
  ui_error: "#B8632E"

  prompt: "#F4F1EA"
  input_rule: "#3A4856"
  response_border: "#D49B4A"
  session_label: "#D49B4A"
  session_border: "#3A4856"
  section_label: "#B8632E"

  status_bar_bg: "#101820"
