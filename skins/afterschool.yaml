  diff_removed_word: "#B8632E"
  syntax_string: "#6B8E5A"
  syntax_number: "#F4F1EA"
  syntax_keyword: "#D49B4A"
  syntax_comment: "#8A99A8"

spinner:
  waiting_faces:
    - "(•)"
    - "(·)"
    - "(•)"
    - "(·)"
  thinking_faces:
    - "(•)"
    - "(·)"
    - "(•)"
    - "(·)"
  thinking_verbs:
    - "on it"
    - "reading the brief"
    - "drafting"
    - "checking the details"
    - "closing the loop"
    - "shipping"
  wings:
    - ["• ", " •"]
    - ["· ", " ·"]
    - ["• ", " •"]
    - ["· ", " ·"]

branding:
  agent_name: "Afterschool Agent"
  welcome: "Afterschool Agent — what are we building?"
  goodbye: "Done. •"
  response_label: " • Afterschool "
  prompt_symbol: "•"
  help_header: "• Afterschool — say the word"

