name: afterschool
description: Afterschool Agent — calm ink-and-sand. Slate, paper, and a single warm accent for headings and active borders.

# Palette
#   paper white    #F4F1EA   (primary text, light rows)
#   soft sand      #E5DCC8   (gradient step)
#   muted teal     #6E8A8A   (gradient step)
#   slate          #2E3A45   (deep shadow rows — decorative only)
#   ink            #1A222B   (background — calm, not blue, not black)
#   amber accent   #D49B4A   (accent — headings, active borders, banners)
#   rust           #B8632E   (warnings, active prompts)
#   moss           #6B8E5A   (success, completed states)

colors:
  background: "#1A222B"

  banner_border: "#3A4856"
  banner_title: "#F4F1EA"
  banner_accent: "#D49B4A"
  banner_dim: "#8A99A8"
  banner_text: "#F4F1EA"

  ui_accent: "#D49B4A"
